# PHY --------------------------------------------------------------------------
phy               : LiteEthPHYRMII
vendor            : xilinx
toolchain         : vivado
clk_freq          : 100e6
phy_hw_init_reset : True

# Ethernet Payload Stream ------------------------------------------------------
# Stream data begins with the IPv4 or ARP header. LiteEth adds/removes the
# 14-byte Ethernet header, preamble and FCS. The destination MAC and EtherType
# are sideband inputs on TX; all Ethernet header fields are sideband outputs on
# RX. Short RX frames can include Ethernet padding after the layer-3 packet.
core        : mac-stream
# Preserve the old UDP configuration's `video_sink_*`/`video_source_*` prefix.
stream_name : video
data_width  : 8
mac_address : 0x10e2d5000000

# FIFO depths are stream beats (bytes when data_width is 8).
tx_fifo_depth : 2048
rx_fifo_depth : 2048
